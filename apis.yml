name: Dext
description: >-
  Dext is bookkeeping automation software for businesses, accountants and
  bookkeepers (formerly Receipt Bank / Dext Precision / Dext Commerce). It
  captures receipts, invoices and bank statements, extracts and validates the
  data with high accuracy, and publishes it into accounting software such as
  Xero, QuickBooks, Sage, Zoho and MYOB. Dext serves over 700,000 customers
  worldwide across the UK, US, Canada, Australia, France and South Africa. For
  accounting practices, Dext exposes a read-only Data Health & Insights REST
  API that returns client data-health metrics and rolling activity statistics,
  authenticated with practice-scoped bearer tokens and rate limited to 60
  requests per minute.
